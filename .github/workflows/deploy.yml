name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to New VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 180s
          command_timeout: 15m

          script: |
            set -e

            echo "Starting deployment to NEW VPS..."

            cd /root/Veagle-safety

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing frontend dependencies..."
            cd client
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            cd ../server
            npm ci

            echo "Syncing Prisma Database Schema..."
            npx prisma db push --skip-generate

            echo "Generating Prisma Client..."
            npx prisma generate

            echo "Restarting backend..."
            pm2 restart sakhi-suraksha-server --update-env

            echo "Restarting frontend..."
            pm2 restart sakhi-suraksha-client --update-env

            echo "Saving PM2 process list..."
            pm2 save

            echo "Deployment completed successfully!"
